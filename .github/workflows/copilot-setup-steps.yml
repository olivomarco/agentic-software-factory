name: Copilot Setup Steps

# Prepares the cloud agent's environment

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml, scripts/bootstrap.sh]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml, scripts/bootstrap.sh]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Shared with the dev container (Codespaces) and CI.
      - run: bash scripts/bootstrap.sh
