name: Copilot Setup Steps

# Prepares the cloud agent's environment

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The project is dependency-free, so there is nothing to install.
      # Stacks with dependencies run `npm ci` (or the Maven/Gradle equivalent) here.
