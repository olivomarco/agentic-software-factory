name: CodeQL

# Code scanning for the app (JavaScript/TypeScript) and for the factory's own
# workflows (actions). Results show up as GitHub's "CodeQL" check on the PR;
# the rulesets' code_scanning rule blocks a merge on new high or critical
# security alerts and on new errors, and the risk gate waits for that check.
# One job (no matrix) so the check name stays "analyze".
on:
  pull_request:
  push:
    branches: [main, "factory/**"]
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
