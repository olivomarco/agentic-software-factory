name: Evidence publish

# Posts the Evidence run's screenshots on the pull request. Runs the default
# branch's script with a write token and treats the artifact as untrusted
# (.github/factory/evidence-publish.cjs).
on:
  workflow_run:
    workflows: [Evidence]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/factory
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v7
        with:
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/.github/factory/evidence-publish.cjs`);
            await publish({ github, context, core, dir: `${process.env.RUNNER_TEMP}/evidence` });
