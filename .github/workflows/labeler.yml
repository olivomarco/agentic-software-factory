name: Labeler

# Labels pull requests by the paths they change (.github/labeler.yml).
# pull_request_target reads the config from the default branch and never runs
# the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
