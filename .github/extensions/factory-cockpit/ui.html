<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Factory cockpit</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1f2328; --muted: #59636e; --subtle: #818b98; --bg: #ffffff; --canvas: #f6f8fa; --card: #ffffff;
    --line: #d1d9e0; --line-soft: #e6ebf0; --hover: #f3f5f8; --accent: #0969da; --accent-fg: #ffffff; --accent-soft: #ddf4ff;
    --ok: #1a7f37; --ok-soft: #dafbe1; --warn: #9a6700; --warn-soft: #fff8c5; --bad: #cf222e; --bad-soft: #ffebe9;
    --purple: #8250df; --orange: #bc4c00; --teal: #1b7c83; --gray: #6e7781;
    --shadow: 0 1px 0 rgba(31,35,40,.04), 0 1px 3px rgba(31,35,40,.08);
    --shadow-lg: 0 8px 24px rgba(66,74,83,.18);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6edf3; --muted: #9198a1; --subtle: #6e7681; --bg: #0d1117; --canvas: #010409; --card: #151b23;
      --line: #3d444d; --line-soft: #262c36; --hover: #1d242e; --accent: #4493f8; --accent-fg: #ffffff; --accent-soft: #121d2f;
      --ok: #3fb950; --ok-soft: #12261e; --warn: #d29922; --warn-soft: #272115; --bad: #f85149; --bad-soft: #25171c;
      --purple: #ab7df8; --orange: #f0883e; --teal: #39c5cf; --gray: #9198a1;
      --shadow: 0 0 0 1px rgba(0,0,0,0); --shadow-lg: 0 8px 24px rgba(1,4,9,.75);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--canvas); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  svg { flex: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }

  /* Header */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, #6e40c9, #0969da); color: #fff; box-shadow: var(--shadow); }
  .brand { min-width: 0; flex: 1; }
  .brand h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .brand .sub { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
  .brand .sub a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub a:hover { color: var(--accent); }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulse 2.4s infinite; }
  .live.stale { background: var(--subtle); animation: none; }
  .live.err { background: var(--bad); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .tools { display: flex; gap: 4px; }
  .icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; }
  .icon-btn:hover { background: var(--hover); color: var(--fg); border-color: var(--line-soft); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .subbar { display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; }
  .tabs { display: flex; gap: 2px; padding: 3px; background: var(--canvas); border: 1px solid var(--line-soft); border-radius: 9px; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--fg); }
  .tab.active { background: var(--card); color: var(--fg); box-shadow: var(--shadow), 0 0 0 1px var(--line-soft); }
  .count { min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--line-soft); color: var(--muted); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
  .count.alert { background: var(--bad); color: #fff; }
  .search { flex: 1; min-width: 80px; display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--subtle); }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; }
  kbd { font: 10px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }

  main { padding: 12px 14px 40px; max-width: 1100px; margin: 0 auto; }

  /* Pipeline */
  .pipeline { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .stage-chip { flex: none; display: flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--card); color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; box-shadow: var(--shadow); }
  .stage-chip b { color: var(--fg); font-size: 13px; font-variant-numeric: tabular-nums; }
  .stage-chip:hover { border-color: var(--c); }
  .stage-chip.zero { opacity: .55; box-shadow: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--gray)); }

  /* Sections */
  .section { margin-bottom: 14px; }
  .section > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 6px 2px; cursor: pointer; user-select: none; position: sticky; top: var(--hdr, 104px); z-index: 2; background: var(--canvas); }
  .section > summary::-webkit-details-marker { display: none; }
  .section > summary .chev { color: var(--subtle); transition: transform .15s; }
  .section:not([open]) > summary .chev { transform: rotate(-90deg); }
  .section > summary h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .section > summary .hint { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 8px; }

  /* Cards */
  .card { position: relative; background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 10px 12px 10px 14px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s, transform .15s; overflow: visible; }
  .card::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, transparent); }
  .card:hover { border-color: var(--line); box-shadow: var(--shadow-lg); }
  .card .top { display: flex; align-items: flex-start; gap: 8px; }
  .card .title { flex: 1; min-width: 0; text-decoration: none; font-weight: 600; line-height: 1.35; }
  .card .title:hover { color: var(--accent); }
  .card .num { color: var(--subtle); font-weight: 400; margin-right: 4px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .meta .item { display: inline-flex; align-items: center; gap: 4px; }
  .label { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--lc) 45%, var(--line-soft)); background: color-mix(in srgb, var(--lc) 12%, transparent); color: var(--fg); font-size: 11.5px; font-weight: 500; }
  .label i { width: 7px; height: 7px; border-radius: 50%; background: var(--lc); }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.info { background: var(--accent-soft); color: var(--accent); }
  .badge.neutral { background: var(--line-soft); color: var(--muted); }
  .avatars { display: inline-flex; }
  .avatars img { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--card); margin-left: -5px; background: var(--line-soft); }
  .avatars img:first-child { margin-left: 0; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--hover); border-color: var(--subtle); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); box-shadow: inset 0 -1px 0 rgba(0,0,0,.12); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn.success { background: var(--ok); border-color: transparent; color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--hover); color: var(--fg); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .spacer { flex: 1; }

  .more { position: relative; }
  .menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 10; min-width: 170px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); display: none; }
  .more.open .menu { display: block; animation: pop .12s ease-out; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; }
  .menu button:hover { background: var(--hover); }
  .menu button.danger { color: var(--bad); }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }

  /* Specs */
  .progress { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar-track { flex: 1; height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; display: flex; }
  .bar-track span { height: 100%; }
  .tickets { list-style: none; margin: 8px 0 0; padding: 0; }
  .tickets li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 12.5px; }
  .tickets li:hover { background: var(--hover); }
  .tickets a { flex: 1; min-width: 0; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tickets a:hover { color: var(--accent); }
  .tickets .closed a { color: var(--subtle); text-decoration: line-through; }
  .st { width: 16px; height: 16px; display: grid; place-items: center; }

  /* Pull requests */
  .diff { font-variant-numeric: tabular-nums; }
  .diff .add { color: var(--ok); } .diff .del { color: var(--bad); }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .checks span { display: inline-flex; align-items: center; gap: 5px; }
  .gate-note { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: var(--canvas); color: var(--muted); font-size: 12px; }

  /* States */
  .empty { display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--subtle); font-size: 12.5px; }
  .hero-empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .hero-empty .big { font-size: 34px; margin-bottom: 8px; }
  .error { display: flex; gap: 8px; padding: 12px; border-radius: var(--radius); background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
  .skeleton { height: 92px; border-radius: var(--radius); background: linear-gradient(90deg, var(--line-soft) 0%, var(--hover) 50%, var(--line-soft) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  #toast { position: fixed; left: 50%; bottom: 16px; z-index: 20; display: flex; align-items: center; gap: 8px; max-width: min(92vw, 520px); padding: 9px 14px; border-radius: 10px; background: var(--fg); color: var(--bg); box-shadow: var(--shadow-lg); font-weight: 500; transform: translate(-50%, 140%); opacity: 0; transition: transform .25s cubic-bezier(.2,.9,.3,1.2), opacity .2s; }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
  #toast.bad { background: var(--bad); color: #fff; }

  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(92vw, 420px); background: var(--card); color: var(--fg); box-shadow: var(--shadow-lg); }
  dialog::backdrop { background: rgba(1,4,9,.45); backdrop-filter: blur(2px); }
  dialog .body { padding: 18px 18px 6px; }
  dialog h3 { margin: 0 0 6px; font-size: 15px; }
  dialog p { margin: 0; color: var(--muted); }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px 16px; }

  @media (max-width: 520px) { .search kbd { display: none; } .section > summary .hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21V10l5 3V10l5 3V6l8 4v11z"/><path d="M7 17h2M12 17h2M17 17h1"/></svg>
    </div>
    <div class="brand">
      <h1>Factory cockpit</h1>
      <div class="sub"><span id="live" class="live stale" title="Live updates"></span><a id="repo" target="_blank" rel="noopener">…</a><span>·</span><span id="fetched">loading</span></div>
    </div>
    <div class="tools">
      <a id="project" class="icon-btn" target="_blank" rel="noopener" title="Project board" hidden></a>
      <button id="dispatch" class="icon-btn" title="Run the dispatcher now"></button>
      <button id="refresh" class="icon-btn" title="Refresh (r)"></button>
    </div>
  </div>
  <div class="subbar">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="queue" role="tab">Queue <span class="count" id="c-queue">·</span></button>
      <button class="tab" data-tab="specs" role="tab">Specs <span class="count" id="c-specs">·</span></button>
      <button class="tab" data-tab="pulls" role="tab">PRs <span class="count" id="c-pulls">·</span></button>
    </nav>
    <label class="search"><span id="search-icon"></span><input id="q" placeholder="Filter" autocomplete="off" /><kbd>/</kbd></label>
  </div>
</header>
<main id="main"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm">
  <form method="dialog">
    <div class="body"><h3 id="confirm-title"></h3><p id="confirm-text"></p></div>
    <div class="foot"><button class="btn" value="no">Cancel</button><button class="btn primary" value="yes" id="confirm-ok">Confirm</button></div>
  </form>
</dialog>
<script>

let state = null;
let tab = "queue";
let query = "";
const collapsed = new Set(["human"]);

  block: '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>',

  pending: '<svg width="12" height="12" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="var(--warn)"/></svg>',

// Failures the factory could not recover from on its own (docs/factory.md, "When things fail").
const ATTENTION = { key: "attention", title: "Needs attention", hint: "Failed runs and work the factory handed back after a retry", c: "var(--bad)" };

const STAGES = [
  { key: "triage", title: "Needs triage", hint: "Read triage's comment, then grill, spec or hand to the agent", c: "var(--purple)" },
  { key: "needs-info", title: "Waiting for info", hint: "The reporter has questions to answer", c: "var(--orange)" },
  { key: "spec", title: "Spec to approve", hint: "Read ## Spec on the issue, then approve", c: "var(--accent)" },
  { key: "approved", title: "Approved specs", hint: "Being split into tickets and built", c: "var(--ok)" },
  { key: "ready", title: "Ready for agent", hint: "Waiting for a dispatch slot or a blocker", c: "var(--teal)" },
  { key: "in-progress", title: "In progress", hint: "The cloud agent is working", c: "var(--warn)" },
  { key: "human", title: "Ready for human", hint: "Needs a person to implement", c: "var(--gray)" },
];

// [action, label, kind] where kind is primary | secondary | more | danger (in the menu)
const ISSUE_ACTIONS = {
  triage: [["grill-local", "Grill here", "primary"], ["ready-for-agent", "Ready for agent"], ["spec", "/spec"], ["retriage", "Re-triage", "more"], ["wontfix", "Won't fix", "danger"]],
  "needs-info": [["grill-local", "Grill here", "primary"], ["retriage", "Re-triage"]],
  spec: [["approve-spec", "Approve spec", "success"], ["grill-local", "Grill here"], ["spec", "Rewrite spec", "more"]],
  human: [["ready-for-agent", "Hand to agent"]],
};

// Actions for an issue in the attention list, by why it is there.
function attentionActions(i) {
  if (i.labels.includes("agent:failed")) return [["retry-agent", "Retry agent", "primary"], ["grill-local", "Grill here"], ["wontfix", "Won't fix", "danger"]];
  if (/^\[aw\]/.test(i.title)) return [["close-report", "Close report"]];
  return [["retriage-failed", "Re-triage", "primary"], ["grill-local", "Grill here"], ["wontfix", "Won't fix", "danger"]];
}

const LABEL_COLORS = {
  "agent:failed": "#cf222e", "factory:failure": "#d93f0b",
  bug: "#d73a4a", enhancement: "#0ea5b7", documentation: "#0075ca", "possible-duplicate": "#d4a72c", refactor: "#8250df",
  tests: "#57606a", ci: "#57606a", dependencies: "#0366d6", factory: "#6e40c9", "door:one-way": "#cf222e", "lane:local": "#8250df", "needs-human": "#cf222e",
};
const SHOWN_LABELS = Object.keys(LABEL_COLORS);

const CONFIRM = {
  "approve-spec": (n) => ["Approve this spec?", `The factory splits #${n} into tickets and the cloud agent starts building them.`, "Approve spec"],
  "build-local": (n) => ["Build here?", `Spec #${n} leaves the cloud agent's queue and is built in this Copilot CLI session on local/spec-${n}.`, "Build here"],
  "human-approve": (n) => ["Approve this head?", `PR #${n} merges once its checks pass. A new push needs a new approval.`, "Approve"],
  "retry-agent": (n) => ["Retry the cloud agent?", `#${n} goes back to the agent with a new session and a fresh retry budget. If its earlier pull request is still open, close it once the new one replaces it.`, "Retry agent"],
  "close-report": (n) => ["Close this failure report?", `Close #${n} once its cause is fixed or the run was re-run.`, "Close report"],
  wontfix: (n) => ["Close as won't fix?", `#${n} gets the wontfix label.`, "Won't fix"],
};

const $ = (s) => document.querySelector(s);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("data-") || k.startsWith("aria-")) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
}
const icon = (name) => el("span", { class: "st", html: ICON[name] });
const label = (name) => el("span", { class: "label", style: `--lc:${LABEL_COLORS[name] || "#8b949e"}` }, el("i"), name);
const badge = (text, kind = "neutral", ic) => el("span", { class: `badge ${kind}` }, ic ? el("span", { html: ICON[ic], style: "display:inline-flex" }) : null, text);
const metaItem = (ic, text, title) => el("span", { class: "item", title: title || "" }, ic ? el("span", { html: ICON[ic], style: "display:inline-flex" }) : null, text);

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

function toast(msg, ok = true) {
  const t = $("#toast");
  t.replaceChildren(el("span", { html: ok ? "✓" : "✕" }), msg);
  t.className = ok ? "show" : "show bad";
  clearTimeout(toast.h);
  toast.h = setTimeout(() => (t.className = ok ? "" : "bad"), 4500);
}

function ask(title, text, ok) {
  const d = $("#confirm");
  $("#confirm-title").textContent = title;
  $("#confirm-text").textContent = text;
  $("#confirm-ok").textContent = ok;
  d.returnValue = "";
  d.showModal();
  return new Promise((resolve) => d.addEventListener("close", () => resolve(d.returnValue === "yes"), { once: true }));
}

async function act(action, number, button) {
  if (CONFIRM[action] && !(await ask(...CONFIRM[action](number)))) return;
  if (button) button.disabled = true;
  try {
    const r = await fetch(`${base}/api/action`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, number }) });
    const body = await r.json().catch(() => ({}));
    toast(body.message || (r.ok ? "Done" : "Failed"), r.ok);
    if (r.ok) setTimeout(load, 1500);
  } catch (e) {
    toast(String(e), false);
  } finally {
    if (button) button.disabled = false;
  }
}

function closeMenus(except) {
  document.querySelectorAll(".more.open").forEach((m) => m !== except && m.classList.remove("open"));
}

function actionBar(number, actions) {
  if (!actions.length) return null;
  const bar = el("div", { class: "actions" });
  const inline = actions.filter(([, , k]) => k !== "more" && k !== "danger");
  const menu = actions.filter(([, , k]) => k === "more" || k === "danger");
  for (const [action, text, kind] of inline) {
    const b = el("button", { class: `btn ${kind || ""}`, textContent: text });
    b.onclick = () => act(action, number, b);
    bar.append(b);
  }
  if (menu.length) {
    bar.append(el("span", { class: "spacer" }));
    const wrap = el("div", { class: "more" });
    const toggle = el("button", { class: "btn ghost", html: ICON.kebab, title: "More actions", "aria-haspopup": "menu" });
    const list = el("div", { class: "menu", role: "menu" });
    for (const [action, text, kind] of menu) {
      const b = el("button", { class: kind === "danger" ? "danger" : "", textContent: text, role: "menuitem" });
      b.onclick = () => { wrap.classList.remove("open"); act(action, number, toggle); };
      list.append(b);
    }
    toggle.onclick = (e) => { e.stopPropagation(); closeMenus(wrap); wrap.classList.toggle("open"); };
    wrap.append(toggle, list);
    bar.append(wrap);
  }
  return bar;
}

function card(item, { color, meta = [], right, actions = [], extra = [] }) {
  return el("article", { class: "card", style: color ? `--c:${color}` : "" },
    el("div", { class: "top" },
      el("a", { class: "title", href: item.url, target: "_blank", rel: "noopener" }, el("span", { class: "num", textContent: `#${item.number}` }), item.title),
      right || null),
    meta.length ? el("div", { class: "meta" }, ...meta) : null,
    ...extra,
    actionBar(item.number, actions));
}

function avatars(logins) {
  if (!logins?.length) return null;
  return el("span", { class: "avatars", title: logins.join(", ") },
    ...logins.slice(0, 3).map((l) => el("img", { src: `https://github.com/${encodeURIComponent(l.replace(/\[bot\]$/, ""))}.png?size=40`, alt: l, loading: "lazy", onerror() { this.style.visibility = "hidden"; } })));
}

function issueMeta(i) {
  const m = i.labels.filter((l) => SHOWN_LABELS.includes(l)).map(label);
  if (i.blockedBy) m.push(badge(`blocked by ${i.blockedBy}`, "bad", "block"));
  if (i.subIssues) m.push(metaItem("branch", `${i.subIssues} tickets`));
  if (i.comments) m.push(metaItem("comment", String(i.comments), `${i.comments} comments`));
  if (i.updated) m.push(el("span", { class: "item", textContent: ago(i.updated) }));
  const av = avatars(i.assignees);
  if (av) m.push(av);
  return m;
}

const matches = (item) => !query || `#${item.number} ${item.title} ${(item.labels || []).join(" ")}`.toLowerCase().includes(query);

function section(key, titleText, hint, color, count, body) {
  const d = el("details", { class: "section", id: `s-${key}`, open: !collapsed.has(key) });
  d.addEventListener("toggle", () => (d.open ? collapsed.delete(key) : collapsed.add(key)));
  d.append(el("summary", {},
    el("span", { html: ICON.chev, style: "display:inline-flex" }),
    el("span", { class: "dot", style: `--c:${color}` }),
    el("h2", { textContent: titleText }),
    el("span", { class: "count", textContent: count }),
    hint ? el("span", { class: "hint", textContent: hint }) : null), body);
  return d;
}

function runCard(r) {
  const what = { startup_failure: "did not start", timed_out: "timed out", failure: "failed" }[r.conclusion] || r.conclusion;
  const bar = r.rerunnable ? actionBar(r.id, [["rerun-run", "Re-run failed jobs", "primary"]]) : null;
  if (bar) bar.append(el("a", { class: "btn", href: r.url, target: "_blank", rel: "noopener", textContent: "Logs" }));
  return el("article", { class: "card", style: "--c:var(--bad)" },
    el("div", { class: "top" },
      el("a", { class: "title", href: r.url, target: "_blank", rel: "noopener" }, el("span", { class: "num", textContent: r.workflow }), r.title === r.workflow ? "" : r.title),
      badge(what, "bad", "x")),
    el("div", { class: "meta" },
      el("span", { class: "item", textContent: r.event === "dynamic" ? "agent session" : `on ${r.event.replace(/_/g, " ")}` }),
      r.attempt > 1 ? el("span", { class: "item", textContent: `attempt ${r.attempt}` }) : null,
      el("span", { class: "item", textContent: ago(r.at) }),
      r.rerunnable ? null : el("span", { class: "item", textContent: "re-run it from the pull request" })),
    bar);
}

const attentionCount = () => state.issues.filter((i) => i.stage === "attention").length + (state.failedRuns || []).length;

function renderAttention(main) {
  const issues = state.issues.filter((i) => i.stage === "attention" && matches(i));
  const runs = (state.failedRuns || []).filter((r) => !query || `${r.workflow} ${r.title}`.toLowerCase().includes(query));
  if (!issues.length && !runs.length) return;
  const grid = el("div", { class: "grid" });
  for (const r of runs) grid.append(runCard(r));
  for (const i of issues) grid.append(card(i, { color: ATTENTION.c, meta: issueMeta(i), actions: attentionActions(i) }));
  main.append(section(ATTENTION.key, ATTENTION.title, ATTENTION.hint, ATTENTION.c, issues.length + runs.length, grid));
}

function renderQueue(main) {
  const strip = el("div", { class: "pipeline" });
  const needs = attentionCount();
  if (needs) {
    const chip = el("button", { class: "stage-chip", style: `--c:${ATTENTION.c}`, title: ATTENTION.hint }, el("span", { class: "dot" }), el("b", { textContent: needs }), ATTENTION.title);
    chip.onclick = () => { const t = document.getElementById("s-attention"); if (t) { t.open = true; t.scrollIntoView({ behavior: "smooth", block: "start" }); } };
    strip.append(chip);
  }
  for (const s of STAGES) {
    const n = state.issues.filter((i) => i.stage === s.key).length;
    const chip = el("button", { class: `stage-chip${n ? "" : " zero"}`, style: `--c:${s.c}`, title: s.hint },
      el("span", { class: "dot" }), el("b", { textContent: n }), s.title);
    chip.onclick = () => { collapsed.delete(s.key); const t = document.getElementById(`s-${s.key}`); if (t) { t.open = true; t.scrollIntoView({ behavior: "smooth", block: "start" }); } };
    strip.append(chip);
  }
  main.append(strip);
  renderAttention(main);
  let shown = 0;
  for (const s of STAGES) {
    const items = state.issues.filter((i) => i.stage === s.key && matches(i));
    if (!items.length && (query || ["human", "approved"].includes(s.key))) continue;
    shown += items.length;
    const grid = el("div", { class: "grid" });
    if (!items.length) grid.append(el("div", { class: "empty", textContent: "Nothing here" }));
    for (const i of items) grid.append(card(i, { color: s.c, meta: issueMeta(i), actions: ISSUE_ACTIONS[s.key] || [] }));
    main.append(section(s.key, s.title, s.hint, s.c, items.length, grid));
  }
  if (query && !shown) main.append(noMatch());
}

function ticketIcon(t) {
  if (t.state === "closed") return "done";
  if (t.labels.includes("agent:failed")) return "alert";
  if (t.labels.includes("status:in-progress")) return "bot";
  if (t.blockedBy) return "blocked";
  return "open";
}

function renderSpecs(main) {
  const specs = state.specs.filter(matches);
  if (!state.specs.length) return main.append(hero("📐", "No specs yet", "Grill a big issue in the Queue, then comment /spec on it."));
  if (!specs.length) return main.append(noMatch());
  const grid = el("div", { class: "grid" });
  for (const s of specs) {
    const total = s.tickets.length;
    const done = s.tickets.filter((t) => t.state === "closed").length;
    const busy = s.tickets.filter((t) => t.state !== "closed" && t.labels.includes("status:in-progress")).length;
    const local = (s.labels || []).includes("lane:local");
    const approved = s.stage === "approved";
    const meta = [metaItem("branch", el("span", { class: "mono", textContent: local ? `local/spec-${s.number}` : s.branch }))];
    if (local) meta.push(label("lane:local"));
    const pr = state.pulls.find((p) => p.head === s.branch || p.head === `local/spec-${s.number}`);
    if (pr) meta.push(el("a", { href: pr.url, target: "_blank", rel: "noopener", class: "item", textContent: `PR #${pr.number}` }));
    const extra = [];
    if (total) {
      const pct = (n) => `${(100 * n) / total}%`;
      extra.push(el("div", { class: "progress" },
        el("div", { class: "bar-track" }, el("span", { style: `width:${pct(done)};background:var(--purple)` }), el("span", { style: `width:${pct(busy)};background:var(--warn)` })),
        `${done}/${total} done`));
      const ul = el("ul", { class: "tickets" });
      for (const t of s.tickets) {
        ul.append(el("li", { class: t.state === "closed" ? "closed" : "" },
          icon(ticketIcon(t)),
          el("a", { href: t.url, target: "_blank", rel: "noopener", title: t.title }, el("span", { class: "num", textContent: `#${t.number} ` }), t.title),
          t.labels.includes("agent:failed") && t.state !== "closed" ? badge("agent failed", "bad") : t.blockedBy && t.state !== "closed" ? badge("blocked", "bad") : null));
      }
      extra.push(ul);
    }
    const actions = s.stage === "spec" ? ISSUE_ACTIONS.spec : approved && !local ? [["build-local", "Build here", "primary"]] : [];
    grid.append(card(s, {
      color: approved ? "var(--ok)" : "var(--accent)",
      right: badge(approved ? "approved" : "awaiting approval", approved ? "ok" : "warn"),
      meta, extra, actions,
    }));
  }
  main.append(grid);
}

function checkIcon(st) { return st === "success" ? "check" : st === "failure" || st === "cancelled" || st === "timed_out" ? "x" : "pending"; }

function renderPulls(main) {
  if (!state.pulls.length) return main.append(hero("🎉", "No open pull requests", "Everything that was built has merged."));
  const groups = [
    ["human", "Needs a human", "Approve the head or hold it", "var(--bad)", (p) => p.gate === "pending" || p.gate === "failure"],
    ["auto", "Merging on its own", "Low risk, waiting for checks", "var(--ok)", (p) => p.gate === "success"],
    ["agent", "Agent still working", "Draft or not classified yet", "var(--warn)", (p) => !p.gate],
  ];
  let shown = 0;
  for (const [key, title, hint, color, test] of groups) {
    const items = state.pulls.filter((p) => test(p) && matches(p));
    if (!items.length && query) continue;
    shown += items.length;
    const grid = el("div", { class: "grid" });
    if (!items.length) grid.append(el("div", { class: "empty", textContent: "Nothing here" }));
    for (const p of items) {
      const risk = p.risk ? badge(`${p.risk} risk`, p.risk === "low" ? "ok" : "bad") : badge("unclassified");
      const meta = [
        metaItem("branch", el("span", { class: "mono", textContent: p.base })),
        el("span", { class: "item diff", title: `${p.size.files} files` }, el("span", { class: "add", textContent: `+${p.size.additions}` }), el("span", { class: "del", textContent: `−${p.size.deletions}` }), `· ${p.size.files} files`),
        ...p.labels.filter((l) => SHOWN_LABELS.includes(l)).map(label),
      ];
      if (p.draft) meta.push(badge("draft"));
      if (p.labels.includes("hold")) meta.push(badge("on hold", "bad"));
      const av = avatars(p.author ? [p.author] : []);
      if (av) meta.push(av);
      const extra = [];
      const checks = p.checks.filter((c) => c.name);
      if (checks.length) extra.push(el("div", { class: "checks" }, ...checks.map((c) => el("span", { title: `${c.name}: ${c.state || "pending"}` }, el("span", { html: ICON[checkIcon(c.state)], style: "display:inline-flex" }), c.name))));
      if (p.gateText) extra.push(el("div", { class: "gate-note", textContent: p.gateText }));
      grid.append(card(p, {
        color,
        right: risk,
        meta, extra,
        actions: [
          ...(p.gate === "pending" ? [["human-approve", "Approve head", "success"]] : []),
          p.labels.includes("hold") ? ["unhold", "Release hold"] : ["hold", "Hold", p.gate === "pending" ? "more" : undefined],
          ["gate-pr", "Re-run gate", "more"],
        ],
      }));
    }
    main.append(section(`pr-${key}`, title, hint, color, items.length, grid));
  }
  if (query && !shown) main.append(noMatch());
}

const hero = (emoji, title, text) => el("div", { class: "hero-empty" }, el("div", { class: "big", textContent: emoji }), el("strong", { textContent: title }), el("div", { textContent: text }));
const noMatch = () => el("div", { class: "empty", textContent: `Nothing matches "${query}"` });

function renderHeader() {
  $("#repo").textContent = state.repo || "…";
  if (state.repo) $("#repo").href = `https://github.com/${state.repo}`;
  if (state.projectUrl) { $("#project").href = state.projectUrl; $("#project").hidden = false; }
  const cq = $("#c-queue");
  const needs = state.issues ? attentionCount() : 0;
  cq.textContent = state.issues?.length ?? "·";
  cq.classList.toggle("alert", needs > 0);
  cq.title = needs ? `${needs} need attention` : "";
  $("#c-specs").textContent = state.specs?.length ?? "·";
  const human = (state.pulls || []).filter((p) => p.gate === "pending" || p.gate === "failure").length;
  const cp = $("#c-pulls");
  cp.textContent = state.pulls?.length ?? "·";
  cp.classList.toggle("alert", human > 0);
  cp.title = human ? `${human} need a human` : "";
  tick();
}

function tick() {
  if (!state?.fetchedAt) return;
  $("#fetched").textContent = `updated ${ago(state.fetchedAt)}`;
  const stale = Date.now() - new Date(state.fetchedAt) > 120000;
  $("#live").className = `live${state.error ? " err" : stale ? " stale" : ""}`;
}

function render() {
  document.documentElement.style.setProperty("--hdr", `${document.querySelector("header").offsetHeight}px`);
  const main = $("#main");
  main.replaceChildren();
  if (state.error) {
    $("#live").className = "live err";
    return main.append(el("div", { class: "error" }, el("strong", { textContent: "Could not load the factory." }), el("span", { textContent: state.error })));
  }
  renderHeader();
  ({ queue: renderQueue, specs: renderSpecs, pulls: renderPulls })[tab](main);
}

async function load() {
  const r = $("#refresh");
  r.classList.add("spin");
  try { state = await (await fetch(`${base}/api/state`)).json(); } catch (e) { state = { error: String(e) }; }
  r.classList.remove("spin");
  render();
}

function setTab(name) {
  tab = name;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x.dataset.tab === name));
  if (state) render();
  window.scrollTo({ top: 0 });
}

$("#refresh").innerHTML = ICON.refresh;
$("#dispatch").innerHTML = ICON.play;
$("#project").innerHTML = ICON.board;
$("#search-icon").innerHTML = ICON.search;
$("#search-icon").style.display = "inline-flex";
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
$("#refresh").onclick = load;
$("#dispatch").onclick = (e) => act("dispatch", 0, e.currentTarget);
$("#q").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); if (state) render(); });
document.addEventListener("click", () => closeMenus());
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === "Escape") { closeMenus(); if (typing) { $("#q").value = ""; query = ""; $("#q").blur(); if (state) render(); } }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "r") load();
  if (e.key === "1") setTab("queue");
  if (e.key === "2") setTab("specs");
  if (e.key === "3") setTab("pulls");
});
const events = new EventSource(`${base}/api/events`);
events.onmessage = (e) => { const m = JSON.parse(e.data); if (m.tab) setTab(m.tab); if (m.refresh) load(); };
load();
setInterval(load, 60000);
setInterval(tick, 15000);
</script>
</body>
</html>
